name: publish to PyPI

on:
  push:
    tags:
      - "v*"

# Trusted Publishing — no PyPI token in secrets needed.
# One-time setup on PyPI: https://pypi.org/manage/account/publishing/
# Add a pending publisher with:
#   - PyPI project name: exara-agent
#   - Owner: santirivera-oss
#   - Repository: exara-agent
#   - Workflow: publish.yml
#   - Environment: pypi
permissions:
  id-token: write       # required for trusted publishing
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protects publish behind required reviewers if you configure them
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password:` — uses OIDC trusted publishing
