name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Keep CI focused on correctness for the public release. Full style
        # cleanup can happen later without blocking installability.
        run: ruff check ai_agent tests --select E9,F63,F7,F82

      - name: Test
        env:
          # Skip live network calls if any test reaches for them
          AI_AGENT_OFFLINE: "1"
        run: pytest -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Smoke install the built wheel
        run: |
          pip install dist/*.whl
          exara --help
          python -c "from ai_agent.skills.loader import _load_bundled_skills; n = len(_load_bundled_skills()); print(f'bundled skills: {n}'); assert n >= 5"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
